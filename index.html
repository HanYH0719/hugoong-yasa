scene(28,'용황전','이야기','헌월천이 화련을 바라보았다.\n화련은 살짝 웃었다.',[],{when:a=>a.fate4===1,final:true,ending:'empress'})
);
// Letters and written records use the supplied paper prop, including earlier parts.
const narrationSpeakers=['서막','이야기','이름 없는 편지','오래된 출생기록','어머니의 편지','출생 기록','숨겨진 문서','어머니의 당부'];
for(const s of scenes)if(['이름 없는 편지','오래된 출생기록','어머니의 편지','출생 기록','숨겨진 문서'].includes(s.speaker)&&!s.art)s.item='편지종이';

const chapters=['서막 · 취화루','제1장 · 황궁의 연회','제2장 · 낯선 경계','제3장 · 다정한 비밀','막간 · 달빛 아래의 거래','제4장 · 황제의 경고','제5장 · 이름 없는 편지','최종장 · 월화원','제1장 · 거래와 거짓말','제2장 · 찢어진 이름','제3장 · 두 번째 옥패','제4장 · 가짜 황녀','제5장 · 존재해서는 안 될 이름','제6장 · 궁문 앞의 약속','최종장 · 남겨진 침묵','제1장 · 비밀 서랍','제2장 · 처음부터의 거짓','제3장 · 질투의 얼굴','제4장 · 사라진 어머니','제5장 · 훔친 이름','최종장 · 황궁의 종소리','제1장 · 두 개의 인장','제2장 · 이름을 훔친 여인','제3장 · 황제의 출생','제4장 · 황위보다 너를','제5장 · 마지막 용서','제6장 · 열린 궁문','종장 · 자유의 꽃','종장 · 황후의 탄생'];
const PARTS=[{start:0,chapter:0,endChapter:8,title:'봉황의 옥패'},{start:PART2_START,chapter:8,endChapter:15,title:'가짜 황녀'},{start:PART3_START,chapter:15,endChapter:21,title:'취화루의 비밀'},{start:PART4_START,chapter:21,endChapter:29,title:'황후의 탄생'}];
const choiceParts={origin:1,seolbi:1,wol:1,emperor:1,jade2:2,faith2:2,forgive2:2,trust3:3,pursuit3:3,reveal3:3,mercy4:4,fate4:4};
function partForIndex(index){return PARTS.findLastIndex(p=>index>=p.start)+1}
function partNumber(){return partForIndex(state.index)}
function chapterOffset(){return PARTS[partNumber()-1].chapter}
function activeChapters(){const part=PARTS[partNumber()-1];return chapters.slice(part.chapter,part.endChapter)}
function getText(s){return typeof s.text==='function'?s.text(state.answers):s.text}function validSave(s){
  if(!s||!Number.isInteger(s.index)||s.index<0||s.index>=scenes.length||!s.answers||typeof s.answers!=='object'||!Array.isArray(s.history))return false;
  const keys=Object.keys(choiceParts);
  const first=PARTS[partForIndex(s.index)-1].start;
  return Object.entries(s.answers).every(([k,v])=>keys.includes(k)&&(v===0||v===1))&&scenes.slice(first,s.index).every(x=>!x.choice||x.choice in s.answers)&&s.history.every(h=>typeof h.speaker==='string'&&typeof h.text==='string')&&(!scenes[s.index].when||scenes[s.index].when(s.answers))&&(!s.completed||scenes[s.index].final===true);
}
function readSave(){try{const s=JSON.parse(localStorage.getItem(KEY));return validSave(s)?s:null}catch{return null}}function refreshContinue(){$('continueButton').hidden=!readSave()}refreshContinue();
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,2400)}
function save(quiet=false){if(!playing){if(!quiet)toast('이야기를 시작한 뒤 저장할 수 있습니다.');return}try{localStorage.setItem(KEY,JSON.stringify(state));if(!quiet)toast('이 브라우저에 이야기를 저장했습니다.')}catch{if(!quiet)toast('브라우저에서 저장을 허용하지 않고 있습니다.')}}
// Change the background and dialogue together only after the scene is fully dark.
let currentBackground=null, transitioning=false;
async function render(){
  if(transitioning)return;
  const bg=scenes[state.index].art||scenes[state.index].bg;
  const reduce=document.body.classList.contains('no-motion')||matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!currentBackground||currentBackground===bg||reduce){currentBackground=bg;paintScene();return;}
  transitioning=true;
  $('app').inert=true;
  const curtain=$('sceneFade');
  let animation;
  try{
    const image=new Image();image.src=asset(bg);
    await image.decode().catch(()=>{});
    animation=curtain.animate([{opacity:0},{opacity:1}],{duration:320,easing:'ease-in',fill:'forwards'});
    await animation.finished;
    curtain.style.opacity='1';animation.cancel();
    currentBackground=bg;paintScene();
    await Promise.all([...$('cast').querySelectorAll('img')].map(img=>img.decode().catch(()=>{})));
    animation=curtain.animate([{opacity:1},{opacity:0}],{duration:480,easing:'ease-out',fill:'forwards'});
    await animation.finished;
  }finally{
    curtain.style.opacity='0';if(animation)animation.cancel();
    transitioning=false;$('app').inert=false;
  }
}
function paintScene(){const s=scenes[state.index];$('background').style.backgroundImage=`url("${asset(s.art||s.bg)}")`;$('location').replaceChildren();let small=document.createElement('small');small.textContent=`제${partNumber()}부 · ${chapters[s.chapter]}`;$('location').append(small,document.createTextNode(s.bg));$('dialogue').classList.toggle('narration',narrationSpeakers.includes(s.speaker));$('app').classList.toggle('cutscene',!!s.art);$('cast').style.bottom='';$('cast').style.left='';$('cast').style.right='';$('cast').classList.toggle('pendant',!!s.item);$('cast').classList.toggle('paper',s.item==='편지종이');$('cast').classList.toggle('pair',!s.art&&!s.item&&s.cast.length===2);$('cast').replaceChildren();(s.art?[]:s.item?[s.item]:s.cast).forEach(name=>{const img=document.createElement('img');img.src=asset(name);img.alt=name==='편지종이'?'편지와 기록이 담긴 종이':name==='옥황봉패'?'봉황 문양 옥패':name.startsWith('헌월천')?E:name.slice(0,name.startsWith('초월아')?3:4);img.className='person';img.dataset.character=name;if(!s.item&&s.cast.length>1&&s.speaker!=='이야기'&&img.alt!==s.speaker)img.classList.add('dim');$('cast').append(img)});$('speaker').textContent=s.speaker;$('line').textContent=getText(s);$('line').scrollTop=0;$('choices').replaceChildren();$('choices').hidden=!s.choice;$('nextButton').hidden=!!s.choice;if(s.choice){const p=document.createElement('p');p.textContent='어떻게 답하시겠습니까?';$('choices').append(p);s.options.forEach((label,i)=>{const b=document.createElement('button');b.className='ornate';b.textContent=label;b.onclick=()=>choose(i);$('choices').append(b)})}$('progress').innerHTML=activeChapters().map((_,i)=>`<i class="${i<=s.chapter-chapterOffset()?'done':''}"></i>`).join('');$('progress').setAttribute('aria-label',`제${partNumber()}부 · ${s.chapter-chapterOffset()+1} / ${activeChapters().length}장`);layoutCast();save(true)}
function layoutCast(){
  if($('gameScreen').hidden||$('cast').classList.contains('pendant'))return;
  const app=$('app').getBoundingClientRect(),box=$('dialogue').getBoundingClientRect();
  const mobile=app.width<=650;
  // Character scale is independent of the space above the dialogue panel.
  // Only the lower edge is concealed behind the opaque part of that panel.
  $('cast').style.setProperty('--character-height',(app.height*(mobile?.92:.98))+'px');
  $('cast').style.setProperty('--character-top',(mobile?165:Math.max(100,app.height*.11))+'px');
  $('cast').style.setProperty('--cast-cutoff',Math.max(0,app.bottom-(box.top+box.height*.64))+'px');
  $('cast').style.setProperty('--cast-fade-start',(box.top-app.top+box.height*.45)+'px');
  $('cast').style.setProperty('--cast-fade-end',(box.top-app.top+box.height*.64)+'px');
  $('cast').style.setProperty('--character-left',(app.width*.30)+'px');
  $('cast').style.setProperty('--character-right',(app.width*.70)+'px');
}

new ResizeObserver(()=>{if(!$('gameScreen').hidden)layoutCast()}).observe($('dialogue'));
window.addEventListener('resize',layoutCast);
function startPart(part,carry=false){
  if(part<1||part>PARTS.length||transitioning)return;
  const answers=carry?Object.fromEntries(Object.entries(state.answers).filter(([key])=>choiceParts[key]<part)):{};
  const history=carry&&part>partNumber()?[...state.history,{speaker:`제${part}부`,text:PARTS[part-1].title}]:[];
  start({index:PARTS[part-1].start,answers,history});
}
function selectPart(){
  modal('이야기 선택');
  PARTS.forEach((part,i)=>menuButton(`${i+1}부 · ${part.title}`,()=>{close();startPart(i+1)}));
}
function advanceScene(){
  state.index++;
  while(state.index<scenes.length&&scenes[state.index].when&&!scenes[state.index].when(state.answers))state.index++;
  render();
}

function record(s){state.history.push({speaker:s.speaker,text:getText(s)})}function choose(i){if(transitioning)return;const s=scenes[state.index];if(!s.choice)return;state.answers[s.choice]=i;record(s);state.history.push({speaker:'나의 선택',text:s.options[i]});advanceScene();$('nextButton').focus({preventScroll:true})}
function next(){if(transitioning||!playing||$('modal').open||!$('ending').hidden)return;const s=scenes[state.index];if(s.choice)return;record(s);if(s.final){finish();return}advanceScene()}
function start(saved){if(transitioning)return;currentBackground=null;state=saved||{index:0,answers:{},history:[]};playing=true;$('titleScreen').hidden=true;$('ending').hidden=true;$('gameScreen').hidden=false;$('introVideo').pause();$('introVideo').hidden=true;if(state.completed)finish();else render()}
function finish(){
  state.completed=true;
  const part=partNumber(),freedom=scenes[state.index].ending==='freedom';
  $('gameScreen').hidden=true;$('ending').hidden=false;$('summary').replaceChildren();
  $('ending').querySelector('.eyebrow').textContent=part===4?'《후궁야사 : 황후의 탄생》 完':`제${part}부 完`;
  $('ending').querySelector('h1').textContent=part===4?(freedom?'자유의 꽃':'황후의 탄생'):(part===1?'월화원에 드리운 그림자':PARTS[part-1].title);
  const blurb=$('ending').querySelector('p');blurb.style.whiteSpace='pre-line';
  const blurbs=[
    '“화련아… 오지 말라고 했어야 했는데.”\n돌아보는 순간, 모든 빛이 사라졌다.',
    '“아직도 저 아이를 친구라고 생각하느냐?”\n초월아는 아무 말도 하지 않았다.',
    '누구도 믿을 수 없는 밤, 황궁의 종이 울렸다.\n이제 화련은 자신의 이름을 되찾으러 돌아간다.'
  ];
  blurb.textContent=part===4?(freedom?'황녀의 이름과 권력을 내려놓고, 백리화련으로.\n그녀는 자신만의 삶을 향해 걸어갔다.':'“이제 황궁의 비밀은 전부 제 손에 있습니다.”\n백리화련은 살짝 웃었다.') :blurbs[part-1];
  $('ending').querySelector('p:last-child').textContent=part===4?(freedom?'엔딩 — 《자유의 꽃》 · 전편 완결':'메인 엔딩 — 《황후의 탄생》 · 전편 완결'):`제${part}부 完 — ${PARTS[part-1].title}`;
  $('nextPartButton').hidden=part===4;
  if(part<4)$('nextPartButton').textContent=`${part+1}부 · ${PARTS[part].title}로 이어가기`;
  $('restartButton').textContent=`${part}부를 다른 선택으로 다시 시작`;
  $('endingSelectPart').hidden=false;
  const items=part===1?[
    ['황제의 신뢰',state.answers.origin===0?'솔직함을 기억하다':'의문을 남기다'],['설비의 경계',state.answers.seolbi===0?'날카로운 경계':'조용한 견제'],['월아에게 건넨 말',state.answers.wol===0?'모든 비밀':'감춰 둔 진심'],['황제를 향한 마음',state.answers.emperor===0?'피어나는 믿음':'흔들리는 의심']
  ]:part===2?[
    ['봉황옥패',state.answers.jade2===0?'정면으로 지켜 내다':'기지로 지켜 내다'],['황제와의 거리',state.answers.faith2===0?'의심 속에서 열린 마음':'더 깊어진 믿음'],['월아에게 건넨 마음',state.answers.forgive2===0?'용서 뒤에 남은 배신':'끝내 지켜 둔 거리']
  ]:part===3?[
    ['황제에게 건넨 답',state.answers.trust3===0?'한 번 더 믿다':'믿음을 거두다'],['쫓아간 진실',state.answers.pursuit3===0?'월아의 두 장의 기록':'설비의 오래된 개입'],['출생에 대한 선택',state.answers.reveal3===0?'공개 심문을 택하다':'증거를 기다리다']
  ]:[['월아의 마지막',state.answers.mercy4===0?'용서하고 보내다':'궁에서 내보내다'],['화련의 선택',freedom?'자신의 삶으로':'자신의 이름으로 황후에 오르다']];
  for(const [label,value]of items){const span=document.createElement('span');span.textContent=label;const b=document.createElement('b');b.textContent=value;span.append(b);$('summary').append(span)}
  save(true);
}
function modal(title){$('modalContent').replaceChildren();const h=document.createElement('h2');h.textContent=title;$('modalContent').append(h);if(!$('modal').open)$('modal').showModal()}
function menuButton(label,fn){const b=document.createElement('button');b.className='menu-button';b.textContent=label;b.onclick=fn;$('modalContent').append(b)}function close(){$('modal').close()}
function history(){modal('지나온 이야기');if(!state.history.length){const p=document.createElement('p');p.textContent='아직 기록된 이야기가 없습니다.';$('modalContent').append(p)}for(const h of state.history){const row=document.createElement('div');row.className='history-row';const b=document.createElement('b');b.textContent=h.speaker;const p=document.createElement('p');p.textContent=h.text;row.append(b,p);$('modalContent').append(row)}}
$('startButton').onclick=()=>start();$('continueButton').onclick=()=>{const s=readSave();if(s)start(s);else toast('불러올 저장 기록이 없습니다.')};$('restartButton').onclick=()=>startPart(partNumber(),true);$('part2Button').onclick=selectPart;$('endingSelectPart').onclick=selectPart;$('nextPartButton').onclick=()=>startPart(partNumber()+1,true);$('nextButton').onclick=e=>{e.stopPropagation();next()};$('dialogue').onclick=next;$('historyButton').onclick=e=>{e.stopPropagation();history()};$('endingHistory').onclick=history;$('saveButton').onclick=()=>save();$('closeModal').onclick=close;$('modal').addEventListener('click',e=>{if(e.target===$('modal')){const r=$('modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
$('menuButton').onclick=()=>{modal('이야기 메뉴');menuButton('이야기로 돌아가기',close);menuButton('대화 기록',history);menuButton('다른 부 선택',selectPart);menuButton('저장한 이야기 불러오기',()=>{const s=readSave();if(s){close();start(s)}else toast('저장된 이야기가 없습니다.')});menuButton('처음 화면으로',()=>{save(true);close();playing=false;$('gameScreen').hidden=true;$('ending').hidden=true;$('titleScreen').hidden=false;$('introVideo').hidden=false;$('introVideo').play().catch(()=>{});refreshContinue()})};
$('settingsButton').onclick=()=>{modal('설정');audioSettings();const label=document.createElement('label');label.textContent='대사 글자 크기';const range=document.createElement('input');range.type='range';range.min=18;range.max=30;range.value=parseInt(getComputedStyle($('line')).fontSize);range.setAttribute('aria-label','대사 글자 크기');range.oninput=()=>{$('line').style.fontSize=range.value+'px'};label.append(range);$('modalContent').append(label);const motion=document.createElement('label');motion.textContent='장면 움직임 줄이기';const check=document.createElement('input');check.type='checkbox';check.checked=document.body.classList.contains('no-motion');check.onchange=()=>{document.body.classList.toggle('no-motion',check.checked);if(check.checked)$('introVideo').pause();else if(!playing)$('introVideo').play().catch(()=>{})};motion.append(check);$('modalContent').append(motion);const p=document.createElement('p');p.textContent='대화창을 누르거나 Space · Enter 키로 진행합니다. 선택지는 직접 눌러 주세요. 진행 상황은 이 브라우저에 자동 저장됩니다.';$('modalContent').append(p)};
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!['BUTTON','INPUT'].includes(document.activeElement.tagName)&&!$('modal').open){e.preventDefault();if(playing&&!transitioning){audioStarted=true;resumeMusic();playClick()}next()}});
</script></body></html>
